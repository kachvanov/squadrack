name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          if [ ! -f stack/compose.yaml ]; then
            echo "stack/compose.yaml not written yet, skipping"
            exit 0
          fi
          cp stack/.env.example stack/.env
          docker compose -f stack/compose.yaml config --quiet
