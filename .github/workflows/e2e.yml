name: e2e

# Bring the whole stack up from stack/compose.yaml on a clean runner and check it with doctor.py

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Write .env files from the templates with throwaway secrets
        run: |
          secret() { openssl rand -hex 16; }
          set_var() { sed -i "s|^$2=.*|$2=$3|" "$1"; }

          pg_password=$(secret); s3_key=$(secret); s3_secret=$(secret)
          s3_ui_password=$(secret); mlflow_password=$(secret); mlflow_secret_key=$(secret)
          for s in "$pg_password" "$s3_secret" "$s3_ui_password" "$mlflow_password" "$mlflow_secret_key"; do
            echo "::add-mask::$s"
          done

          cp stack/.env.example stack/.env
          cp .env.example .env
          set_var stack/.env POSTGRES_PASSWORD "$pg_password"
          set_var stack/.env S3_ADMIN_ACCESS_KEY "$s3_key"
          set_var stack/.env S3_ADMIN_SECRET_KEY "$s3_secret"
          set_var stack/.env S3_ADMIN_UI_PASSWORD "$s3_ui_password"
          set_var stack/.env MLFLOW_ADMIN_PASSWORD "$mlflow_password"
          set_var stack/.env MLFLOW_SECRET_KEY "$mlflow_secret_key"
          set_var .env AWS_ACCESS_KEY_ID "$s3_key"
          set_var .env AWS_SECRET_ACCESS_KEY "$s3_secret"
          set_var .env MLFLOW_TRACKING_PASSWORD "$mlflow_password"
          if grep -q change-me stack/.env .env; then
            echo "a variable in a template was not filled in:"; grep -n change-me stack/.env .env | cut -d= -f1
            exit 1
          fi

      # Before the stack: the cache key globs the whole checkout, and stack/data/ is owned by
      # the containers. The lock file alone describes the environment.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock

      # A clone on a shared host lives under a default ACL with no bits for others, and BuildKit
      # applies that ACL to copied files even after COPY --chmod. Build from such a tree, so images
      # never depend on the modes of the checkout.
      - name: Put the build context under an ACL, like a clone on a shared host
        run: |
          command -v setfacl > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq acl; }
          setfacl -R -m g:adm:rwX,o::- stack
          getfacl -c stack/mlflow/basic_auth.ini

      - name: Start the stack
        run: docker compose -f stack/compose.yaml up --detach --build --wait --wait-timeout 180

      # SeaweedFS answers on its master, volume and filer ports without a key. Neither the host nor
      # a container outside the storage network may reach them; S3 and the Admin UI go through s3.
      # Checked by HTTP, not by connect: Docker Desktop accepts a TCP connection to any address.
      - name: SeaweedFS is reachable only through the s3 proxy
        run: |
          compose() { docker compose -f stack/compose.yaml "$@"; }
          cid=$(compose ps -q seaweedfs)
          ips=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$cid")
          echo "seaweedfs: $ips"
          [ -n "${ips// }" ] || { echo "seaweedfs has no address"; exit 1; }

          net=$(docker network inspect -f '{{.Id}}' squadrack_storage)
          ip link show dev "br-${net:0:12}" > /dev/null
          if ip -4 -o addr show dev "br-${net:0:12}" | grep .; then
            echo "the bridge of the storage network has an address on the host"; exit 1
          fi

          reached=0
          for ip in $ips; do
            for port in 8888 9333 9340 8333 12535; do
              if curl -sS -o /dev/null --max-time 3 "http://$ip:$port/"; then
                echo "host reaches $ip:$port"; reached=1
              fi
            done
          done
          compose exec -T -e IPS="$ips" mlflow python - <<'EOF' || reached=1
          import os, sys, urllib.error, urllib.request
          reached = []
          for host in ["seaweedfs", *os.environ["IPS"].split()]:
              for port in (8888, 9333, 9340):
                  try:
                      urllib.request.urlopen(f"http://{host}:{port}/", timeout=3)
                      reached.append(f"{host}:{port}")
                  except urllib.error.HTTPError:
                      reached.append(f"{host}:{port}")
                  except OSError as e:
                      print(f"mlflow does not reach {host}:{port}: {e}")
          if reached:
              sys.exit(f"mlflow reaches {', '.join(reached)}")
          EOF
          [ "$reached" = 0 ] || exit 1

          curl -fsS -o /dev/null http://127.0.0.1:8333/healthz && echo "S3 through the proxy: ok"
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:12535/)
          case $code in 2??|3??) echo "Admin UI through the proxy: $code" ;; *) echo "Admin UI: $code"; exit 1 ;; esac

      - name: doctor.py
        run: uv run --locked --env-file .env scripts/doctor.py

      # A project key reaches its own bucket only; a person gets an MLflow login that is not an admin.
      # Secrets go to files with mode 600 and never to the log.
      - name: A project key and an MLflow user from scripts/access.sh
        run: |
          dir=$RUNNER_TEMP/access
          mkdir "$dir"
          scripts/access.sh s3-key demo-project-svc demo-project "$dir/s3.env"
          scripts/access.sh mlflow-user ci-person "$dir/mlflow.env"
          for f in s3 mlflow; do
            [ "$(stat -c %a "$dir/$f.env")" = 600 ] || { echo "$f.env is not mode 600"; exit 1; }
          done
          grep -q '^AWS_SECRET_ACCESS_KEY=.' "$dir/s3.env"
          grep -q '^MLFLOW_TRACKING_PASSWORD=.' "$dir/mlflow.env"

          # Refuses an existing user, an existing file and the artifact bucket, and leaves no file behind.
          # `if`, not `!`: bash -e does not stop on a negated command that succeeds.
          must_fail() { if "$@"; then echo "should have failed: $*"; exit 1; fi; }
          must_fail scripts/access.sh s3-key demo-project-svc demo-project "$dir/again.env"
          must_fail scripts/access.sh mlflow-user ci-person "$dir/again.env"
          must_fail scripts/access.sh s3-key other-svc demo-project "$dir/s3.env"
          must_fail scripts/access.sh s3-key other-svc mlflow "$dir/other.env"
          if [ -e "$dir/again.env" ] || [ -e "$dir/other.env" ]; then echo "a refused call left a file"; exit 1; fi
          scripts/access.sh list

          # Client settings of the project: addresses from .env, the new key and login
          grep -E '^(AWS_ENDPOINT_URL|MLFLOW_TRACKING_URI|MLFLOW_DISABLE_TELEMETRY)=' .env > "$dir/project.env"
          cat "$dir/s3.env" "$dir/mlflow.env" >> "$dir/project.env"

      - name: doctor.py with the project key and the new login
        run: uv run --locked --env-file "$RUNNER_TEMP/access/project.env" scripts/doctor.py --project-key

      - name: A new key with s3-rotate works, the old one is rejected
        run: |
          dir=$RUNNER_TEMP/access
          scripts/access.sh s3-rotate demo-project-svc "$dir/rotated.env"
          if uv run --locked --env-file "$dir/project.env" scripts/doctor.py --project-key --only s3; then
            echo "the old key still works"; exit 1
          fi
          grep -vE '^AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)=' "$dir/project.env" > "$dir/rotated-project.env"
          cat "$dir/rotated.env" >> "$dir/rotated-project.env"
          uv run --locked --env-file "$dir/rotated-project.env" scripts/doctor.py --project-key --only s3

      - name: doctor.py with the admin key again, on the state the runs before left
        run: uv run --locked --env-file .env scripts/doctor.py

      - name: Train and load the demo model
        run: |
          uv run --locked --env-file .env examples/train_demo.py
          uv run --locked --env-file .env examples/predict_demo.py

      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f stack/compose.yaml ps --all
          docker compose -f stack/compose.yaml logs --no-color --tail 200
