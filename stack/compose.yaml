name: squadrack

x-restart: &restart unless-stopped

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
  start_interval: 1s

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - ./data/pg:/var/lib/postgresql
    restart: *restart
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  s3:
    image: chrislusf/seaweedfs:4.54
    command:
      - mini
      - -dir=/data
      - -bucket=mlflow,demo-project
      - -webdav=false
      - -admin.port.legacy=0
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?set S3_ADMIN_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?set S3_ADMIN_SECRET_KEY in .env}
      WEED_ADMIN_PASSWORD: ${S3_ADMIN_UI_PASSWORD:?set S3_ADMIN_UI_PASSWORD in .env}
    volumes:
      - ./data/s3:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:12535:12535" # Admin UI
    restart: *restart
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", 'curl -fsS -o /dev/null http://127.0.0.1:8333/healthz']
