name: squadrack

# Host-specific values come from the environment of `docker compose`, set by a deploy repo
# (see examples/deploy/). Defaults fit a local run from this directory:
#   SQUADRACK_DATA_DIR             where service data lives (default ./data next to this file)
#   MLFLOW_PORT, S3_PORT, S3_ADMIN_UI_PORT   host ports; they always bind to 127.0.0.1 only

x-restart: &restart unless-stopped

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
  start_interval: 1s

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - ${SQUADRACK_DATA_DIR:-./data}/pg:/var/lib/postgresql
    restart: *restart
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  s3:
    image: chrislusf/seaweedfs:4.54
    command:
      - mini
      - -dir=/data
      - -bucket=mlflow,demo-project
      - -webdav=false
      - -admin.port.legacy=0
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?set S3_ADMIN_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?set S3_ADMIN_SECRET_KEY in .env}
      WEED_ADMIN_PASSWORD: ${S3_ADMIN_UI_PASSWORD:?set S3_ADMIN_UI_PASSWORD in .env}
    volumes:
      - ${SQUADRACK_DATA_DIR:-./data}/s3:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"                  # S3 API
      - "127.0.0.1:${S3_ADMIN_UI_PORT:-12535}:12535"       # Admin UI
    restart: *restart
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", 'curl -fsS -o /dev/null http://127.0.0.1:8333/healthz']
  mlflow:
    build: ./mlflow
    image: squadrack-mlflow:3.18.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # Each worker is a separate Python process; 2 are enough for a small team (the default is 4)
      - --workers=2
      - --app-name=basic-auth
      # Host headers to accept: the host port and the service name for containers in the stack network
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
      # User, database and password come from the PG* variables below
      - --backend-store-uri=postgresql://postgres:5432/
      # Clients send artifacts to the server, the server writes them to S3
      - --serve-artifacts
      - --artifacts-destination=s3://mlflow
    environment:
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?set S3_ADMIN_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?set S3_ADMIN_SECRET_KEY in .env}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?set MLFLOW_ADMIN_PASSWORD in .env}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY:?set MLFLOW_SECRET_KEY in .env}
      # No usage reports to mlflow-telemetry.io, from the server and from the UI it serves
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: *restart
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
