# TCP proxy in front of SeaweedFS. SeaweedFS sits in the internal network `storage`, where nothing
# but this proxy is attached: only the S3 API and the Admin UI get out, its master, volume, filer
# and IAM ports, which take requests without a key, do not.

global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # Idle time of a connection; a long upload or download keeps it busy and is not cut
    timeout client 10m
    timeout server 10m

# Docker's DNS from /etc/resolv.conf: the address of seaweedfs is resolved again when compose
# recreates its container, instead of once at start
resolvers docker
    parse-resolv-conf
    hold valid 10s

frontend s3
    bind :8333
    default_backend seaweedfs_s3

backend seaweedfs_s3
    server seaweedfs seaweedfs:8333 check resolvers docker init-addr last,libc,none

frontend admin_ui
    bind :12535
    default_backend seaweedfs_admin_ui

backend seaweedfs_admin_ui
    server seaweedfs seaweedfs:12535 check resolvers docker init-addr last,libc,none
