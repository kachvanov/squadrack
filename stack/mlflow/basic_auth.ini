# MLflow basic auth settings. No secrets here.
# Users and permissions live in the same Postgres database as tracking data
# (auth migrations use their own table alembic_version_auth). The connection
# takes user, database and password from the PG* variables set in compose.
# The admin password comes from MLFLOW_AUTH_ADMIN_PASSWORD on the first start only.
[mlflow]
default_permission = READ
database_uri = postgresql://postgres:5432/
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
